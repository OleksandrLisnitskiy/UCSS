<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Redirecting...</title>
        <meta name="robots" content="noindex,follow">
        <link rel="canonical" href="https://ucssedmonton.ca/useful-info/">
        <script>
            const target = window.location.protocol === 'file:' ? 'useful-info/index.html' : 'useful-info/';
            window.location.replace(target + window.location.search + window.location.hash);
        </script>
    </head>
    <body>
        <p>
            Redirecting to <a href="useful-info/">useful-info/</a>.
        </p>
    </body>
</html>
